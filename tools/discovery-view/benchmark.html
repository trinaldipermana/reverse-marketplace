<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Discovery Backstage</title><link rel="stylesheet" href="/styles.css"></head>
<body><main>
<header><div><h1>Discovery Backstage</h1></div><button id="discover">Discover buyers ↗</button></header>
<div id="seller-info" class="seller-info">Seller: seller_demo</div>
<div class="toolbar"><button id="replay" class="quiet">▶ Walk through</button></div>
<div id="error" role="alert" hidden></div>
<nav id="steps" aria-label="Discovery steps"></nav>
<section class="focus" aria-live="polite"><div class="focus-heading"><div><span class="eyebrow" id="step-label"></span><h2 id="step-title"></h2><p id="step-description"></p></div><div class="navigation"><button id="previous" class="quiet" aria-label="Previous step">←</button><button id="next" class="quiet" aria-label="Next step">→</button></div></div><div id="content"></div></section>

</main><script src="/app.js"></script></body></html>
